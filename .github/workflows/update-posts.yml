name: Daily Post Update

on:
  schedule:
    # 20:00 UTC = 05:00 KST (Korean Standard Time)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Posts
        run: |
          python scripts/fetch_posts.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if git diff --staged --quiet; then
            echo "No changes detected in data/posts.json"
          else
            git commit -m "auto: update MND & Army posts [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
